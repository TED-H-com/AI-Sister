[package]
name = "sister-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed, bounded text-to-speech transport boundary for AI-Sister"
publish = false

[features]
default = []
# The default graph is pure request/response policy. Only the desktop integration that has
# collected explicit Azure consent should enable this native HTTP implementation.
azure = ["dep:ureq"]
# Loopback BreezyVoice adapter. Empty on purpose: it uses std::net to 127.0.0.1:8231
# and must not grow a generic HTTP client or share Azure's ureq path.
local = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = { workspace = true, optional = true }
