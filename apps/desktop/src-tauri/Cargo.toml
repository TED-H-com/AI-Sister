[package]
name = "sister-desktop"
version = "0.1.0-alpha.147"
edition = "2024"
# 和根 workspace 同一個地板；這是第二個 workspace，所以在下方自己宣告再繼承。
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/teddashh/AI-Sister"
authors = ["Ted Huang <ted@ted-h.com>"]
description = "AI-Sister 的桌面外殼：四姊妹與 13 位閨密"
publish = false

# **自己一個 workspace，故意的。**
#
# 開發機是 Linux，而 Tauri 在 Linux 上要 webkit2gtk 才編得起來——這台機器
# 沒有，也沒有 sudo 可以裝。如果這個 crate 掛在根 workspace 底下，
# `cargo test --workspace` 會連它一起編，然後整個開發迴圈就在一個
# 「反正也不會在這台機器上跑」的東西上卡死。
#
# 分開之後：根 workspace 照舊在 Linux 上跑全部測試，這個 crate 只在
# Windows（CI 與 Ted 的機器）上編。代價是 sister-core 會被編兩次。
[workspace]
resolver = "3"

[workspace.package]
rust-version = "1.88"

[features]
default = ["bundled-sqlite", "macos"]
# 見 sister-core 的同名 feature：關掉它才能從 Linux 對 Windows `cargo check`。
bundled-sqlite = ["sister-core/bundled-sqlite"]
# `macos` 是正式原生 sidecar composition；spike 只多出 CI 私有 probe argument。
macos = []
macos-ci-spike = ["macos"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sister-core = { path = "../../../crates/sister-core", default-features = false }
sister-shell = { path = "../../../crates/sister-shell" }
sister-hands = { path = "../../../crates/sister-hands" }
sister-assets = { path = "../../../crates/sister-assets", features = ["download"] }
sister-tts = { path = "../../../crates/sister-tts", features = ["azure", "local"] }
sister-usage = { path = "../../../crates/sister-usage", features = ["public-status"] }
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# startup guard 依照這個版本的 Windows WM_COPYDATA 協定轉交；更新時要連
# `src/single_instance.rs` 的 names、dwData 和 payload 一起核對。
tauri-plugin-single-instance = { version = "=2.4.4", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["AXUIElement", "HIServices"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary", "CFNumber"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGWindow"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
