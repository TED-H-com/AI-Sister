<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      連線一律不准。這個視窗永遠只讀本機檔案與 Tauri 的 IPC——沒有 CDN、
      沒有字型、沒有 analytics。CSP 寫在這裡而不只是 tauri.conf.json，是為了
      讓「她不連外」這句話在使用者按 Ctrl+U 的時候自己看得到。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>AI-Sister</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 拖曳條。Tauri 只有一個 webview，所以拖曳是 `data-tauri-drag-region`
         的事，不像 Electron 要另外開一層 chrome。 -->
    <!--
      平常這條膠囊不在。她整天掛在桌面角落，頭頂上那一條深色的東西是唯一
      一塊「不是她」的畫素——收起來之後那塊同時也點得穿（`paintedRects()`
      跳過 `visibility: hidden`）。要用的時候從**下面**那顆點點鍵叫它出來。

      暫停鍵藏在裡面，而「你隨時停得掉」是這個產品的前提，所以有兩條保險：
      系統匣選單永遠有「暫停」，而且她真的停下來的時候這條膠囊會自己出現
      （`body.she-is-stopped`）——看不到她在錄，也就看不到她停著，那才是最壞的。
    -->
    <header class="dragbar" id="chrome-bar" data-chrome-bar data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>AI-Sister</span>
      <!-- 暫停排在最前面。她整個產品的前提是「你隨時停得掉」，那顆鍵就不該
           藏在設定裡——它跟置頂、收起來是同一級的東西。 -->
      <!--
        這五顆圖示是 inline SVG，不是 Unicode 符號。alpha.127 上 `⚙`（U+2699）
        在 Ted 的 WebView2 上整顆沒有畫出來，而同一份 HTML 在無頭 Chromium 上
        看得到——差別在字型：CSP 是 `default-src 'none'` 且沒有 `font-src`，
        所以這個視窗一個字型都載不進來，符號能不能顯示完全看那台機器的系統字型
        有沒有那一格。SVG 自己帶形狀，不必問任何人。

        暫停和置頂是 toggle，兩個狀態的圖示都放在按鈕裡，由 `aria-pressed`
        用 CSS 選要顯示哪一個。**不要改回 `textContent`**——那會把 SVG 洗掉，
        而且會讓「現在是哪個狀態」同時存在字形和 aria 兩份，遲早不同步。
      -->
      <button class="control" id="pause" type="button" title="暫停記錄" aria-pressed="false">
        <svg class="icon icon-off" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="4" y="3" width="3" height="10" rx="1" />
          <rect x="9" y="3" width="3" height="10" rx="1" />
        </svg>
        <svg class="icon icon-on" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M5 3.4v9.2a.6.6 0 0 0 .92.5l7-4.6a.6.6 0 0 0 0-1l-7-4.6a.6.6 0 0 0-.92.5Z" />
        </svg>
      </button>
      <!-- 「她記得什麼」要和「暫停」放在一起。使用者會想關掉她，多半是因為
           不確定她記了什麼——把翻帳本的入口藏起來，等於逼他用猜的。 -->
      <button class="control" id="timeline" type="button" title="她記得的每一天">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="2.5" y="3" width="11" height="2" rx="1" />
          <rect x="2.5" y="7" width="11" height="2" rx="1" />
          <rect x="2.5" y="11" width="11" height="2" rx="1" />
        </svg>
      </button>
      <button class="control" id="settings" type="button" title="設定" aria-label="設定">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 5.6A2.4 2.4 0 1 0 8 10.4 2.4 2.4 0 0 0 8 5.6Zm0 1.5a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z" />
          <path d="M6.9 1.2h2.2l.3 1.6q.5.2 1 .5l1.5-.6 1.5 2.6-1.2 1.1q.05.3.05.6t-.05.6l1.2 1.1-1.5 2.6-1.5-.6q-.45.3-1 .5l-.3 1.6H6.9l-.3-1.6q-.55-.2-1-.5l-1.5.6-1.5-2.6 1.2-1.1Q3.75 8.3 3.75 8t.05-.6L2.6 6.3l1.5-2.6 1.5.6q.45-.3 1-.5Zm1.2 1.5H8.2l-.25 1.4-.5.15q-.6.2-1.1.55l-.45.3-1.3-.5-.35.6 1.05.95-.05.55q-.03.3-.03.3t.03.3l.05.55-1.05.95.35.6 1.3-.5.45.3q.5.35 1.1.55l.5.15.25 1.4h.7l.25-1.4.5-.15q.6-.2 1.1-.55l.45-.3 1.3.5.35-.6-1.05-.95.05-.55q.03-.3.03-.3t-.03-.3l-.05-.55 1.05-.95-.35-.6-1.3.5-.45-.3q-.5-.35-1.1-.55l-.5-.15Z" />
        </svg>
      </button>
      <button class="control" id="pin" type="button" title="保持在最上層" aria-pressed="true">
        <svg class="icon icon-off" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <svg class="icon icon-on" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="5" />
        </svg>
      </button>
      <button class="control" id="hide" type="button" title="收到系統匣">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="3" y="7.2" width="10" height="1.8" rx="0.9" />
        </svg>
      </button>
    </header>

    <main class="stage">
      <!-- 原生 button 自己提供 Enter／Space 語意；不要手寫 keydown 再觸發一次，
           否則瀏覽器合成的 click 會讓一個按鍵說兩句。 -->
      <button class="avatar" data-avatar type="button">
        <span class="face">
          <!-- 17 位角色圖都隨程式提供；JS 尚未啟動時也直接顯示 ChatGPT。
               WebP 只是完整分層立繪載入前／失敗時的本機退路，不是字母替身。 -->
          <img
            class="portrait"
            data-persona-portrait
            src="./personas/chatgpt.webp"
            alt="ChatGPT 角色圖"
            draggable="false"
          />
          <!--
            本機分層全身 rig。app.js 只有在目前角色的每一張 PNG 都 load + decode
            成功後才會一次放進來；之前與任何失敗都繼續顯示上面的 bundled WebP。
          -->
          <span class="persona-reel" data-persona-reel aria-hidden="true" hidden></span>
        </span>
      </button>
      <p class="state-line" data-state-line>在聽</p>
      <!-- 只有使用者點上面的 button 才會填字；開場、輪詢與 timer 都不碰這一格。 -->
      <p class="persona-line" data-persona-line aria-live="polite" hidden></p>
      <p class="usage-reset-line" data-usage-reset-line aria-live="polite" hidden></p>
      <!-- 固定錄音與本機系統語音仍只能從 click 播。Azure 只在獨立同意
           與預設關閉的自動朗讀開關都有效時，播放使用者新提問的最新答案。 -->
      <audio data-persona-audio preload="none" hidden></audio>
      <!--
        只在「沒有人在記錄」的時候出現。她已經說得出那句話了，但說完之後
        使用者唯一的下一步是開一個終端機打指令——而 Phase 1 的退場條件是
        自用 7 天。把那一步放在她講那句話的正下方。
      -->
      <button class="wake" data-wake type="button" hidden>開始記錄</button>
      <section class="utterance" data-utterance hidden>
        <p class="utterance-text" data-utterance-text></p>
        <div class="utterance-evidence" data-utterance-evidence></div>
        <!-- 出處要自己一行、排在按鈕上面。放在 .utterance-actions 裡面不行——
             那個容器是 display:flex，這句話會變成跟「結案」「其他」併排的 flex
             項目，而不是按下去之前先讀到的一句話。 -->
        <p class="utterance-target-provenance" data-utterance-target-provenance hidden></p>
        <div class="utterance-actions" data-utterance-actions>
          <button type="button" data-utterance-suggestion hidden></button>
          <button type="button" data-utterance-close>結案</button>
          <button type="button" data-utterance-other>其他</button>
        </div>
        <p class="utterance-result" data-utterance-result></p>
      </section>
      <!--
        她問的那一題（PHASES #42）。**只在他還沒答過的時候出現**——一個問過
        的問題再問一次是騷擾，而這個視窗整天掛在螢幕角落。

        兩顆按鈕的字不寫在這裡，是從 `sister_hands::url_policy::UrlOpenAnswer`
        拿的：同一題 `sister url-policy` 也在問，文案分兩份的話他答的是哪一個
        沒人說得準。
      -->
      <section class="asked" data-url-policy hidden>
        <p class="asked-question" data-url-policy-question></p>
        <!-- 「還沒答之前我怎麼做」。少了這一句，一個從來沒被問過的人會以為
             現在這個行為是他自己選的。 -->
        <p class="asked-note" data-url-policy-note></p>
        <div class="asked-actions" data-url-policy-actions></div>
        <p class="asked-result" data-url-policy-result aria-live="polite"></p>
      </section>
      <aside class="gate-debug" data-gate-debug hidden></aside>
      <!-- 文字回答收進同一顆指向角色的氣泡；角色本身維持透明全身大小。 -->
      <section class="answer-bubble" aria-label="AI-Sister 的回答">
        <section class="consent-guide" data-consent-guide hidden>
          <p class="consent-progress" data-consent-progress></p>
          <p class="consent-wording" data-consent-wording></p>
          <p class="consent-without" data-consent-without></p>
          <button class="consent-listen" data-consent-listen type="button">
            🔊 念給我聽
          </button>
          <p class="consent-prompt" data-consent-prompt>
            請在下面輸入「同意」或「不同意」。
          </p>
          <p class="consent-result" data-consent-result aria-live="polite"></p>
        </section>
        <aside class="hands-log" data-hands-log aria-label="行動紀錄"></aside>
        <!-- 每一筆答案都掛著出處。沒有出處的那一行不會出現在這裡。 -->
        <ul class="hits" data-hits hidden></ul>
      </section>
    </main>

    <!--
      送出去了。

      她在想的時候，這一格是唯一的證據。上面那個泡泡是她**講話**的地方，不是
      儀表板——把「這一題等了幾秒」寫進她嘴裡，讀起來就像她在解釋自己為什麼慢。
      這一行貼著輸入框，因為他剛按完 Enter 的手就在這裡。
    -->
    <p class="ask-thinking" data-ask-thinking role="status" aria-live="polite" hidden></p>

    <footer class="ask">
      <!-- 上排控制的唯一入口。放在這一列是因為手已經在這裡（要問她事情的
           地方就在旁邊），而她的頭頂要留給桌面。 -->
      <button
        class="ask-chrome"
        data-chrome-toggle
        type="button"
        title="顯示上排控制（暫停、時間軸、設定）"
        aria-label="顯示上排控制（暫停、時間軸、設定）"
        aria-expanded="false"
        aria-controls="chrome-bar"
      >
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="3.4" cy="8" r="1.35" />
          <circle cx="8" cy="8" r="1.35" />
          <circle cx="12.6" cy="8" r="1.35" />
        </svg>
      </button>
      <input
        class="ask-input"
        data-ask-input
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="問我一件事…"
      />
      <button class="ask-send" data-ask-send type="button" title="問">→</button>
    </footer>

    <!-- 純資料；不存在或不合契約時 app.js 仍只顯示 bundled WebP。 -->
    <script src="./persona-reels/manifest.js"></script>
    <script src="./persona-voices/v1/manifest.js"></script>
    <script src="./persona-consent-voices/v1/manifest.js"></script>
    <script src="./persona-banter-voices/v1/manifest.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
