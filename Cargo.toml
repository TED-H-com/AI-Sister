[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.147"
edition = "2024"
# edition 2024 的地板。沒有這一行的話，舊 toolchain 撞到的是一句在講 manifest
# 解析的錯誤訊息，而真正的問題是「你的 Rust 太舊」——README 的 quickstart 對
# 一個第一次 clone 的人只有一次機會。
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/teddashh/AI-Sister"
authors = ["Ted Huang <ted@ted-h.com>"]

[workspace.dependencies]
sister-core = { path = "crates/sister-core", default-features = false }
sister-capture = { path = "crates/sister-capture", default-features = false }
sister-cli = { path = "crates/sister-cli" }
sister-hands = { path = "crates/sister-hands" }
sister-assets = { path = "crates/sister-assets", default-features = false }
sister-tts = { path = "crates/sister-tts", default-features = false }
sister-usage = { path = "crates/sister-usage", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["clock"] }
# bundled 由 sister-core 的 feature 控制（見該 crate 的 [features]）。
rusqlite = { version = "0.40" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
getrandom = "0.2"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = { version = "=0.11.0", default-features = false }
ureq = { version = "=3.4.1", default-features = false, features = ["native-tls"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
